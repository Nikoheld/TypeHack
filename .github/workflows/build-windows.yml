name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze TypeHack
        run: pyinstaller --noconfirm TypeHack.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\TypeHack.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TypeHack-Setup
          path: dist/TypeHack-Setup-*.exe

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TypeHack-Setup-*.exe
