[package]
name = "typehack"
version = "3.1.0"
edition = "2021"
description = "TypeHack 3.0 — native typewriter.at helper"
authors = ["Nikoheld"]
license = "MIT"
default-run = "TypeHack"

[[bin]]
name = "TypeHack"
path = "src/main.rs"

[lib]
name = "typehack"
path = "src/lib.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
thirtyfour = "0.35"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
